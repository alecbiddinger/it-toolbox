name: Validate toolbox
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax and lint
        run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh tests/*.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in 'toolbox.ps1', 'tests/launcher.ps1') {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD/$file", [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Build image
        run: docker build --pull -t it-toolbox:ci .
      - name: Run offline smoke checks
        run: docker run --rm --network none --mount "type=bind,source=$PWD/tests,target=/tests,readonly" it-toolbox:ci bash /tests/smoke.sh
      - name: Check launcher persistence, exit codes, and argument passing
        shell: pwsh
        run: |
          ./tests/launcher.ps1 -Image it-toolbox:ci
          # Repeat with the native argument passing that Windows PowerShell 5.1 uses.
          $PSNativeCommandArgumentPassing = 'Legacy'
          ./tests/launcher.ps1 -Image it-toolbox:ci
